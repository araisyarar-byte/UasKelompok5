{% load static %}
<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Admin | HireFlow</title><link rel="stylesheet" href="{% static 'pengumuman_laporan/css/style.css' %}"></head>
<body class="login-page">
  <div class="login-card">
    <a class="brand centered dark" href="{% url 'pengumuman_laporan:beranda' %}"><span>H</span> HireFlow</a>
    <h1>Masuk sebagai Admin</h1>
    <p>Kelola pengumuman dan laporan data akhir rekrutmen.</p>
    {% if form.errors %}<div class="error-box">Username atau password tidak sesuai.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <label for="id_username">Username</label>{{ form.username }}
      <label for="id_password">Password</label>{{ form.password }}
      <button class="btn primary full">Masuk</button>
    </form>
    <a class="back-public" href="{% url 'pengumuman_laporan:beranda' %}">← Kembali ke halaman pelamar</a>
  </div>
</body>
</html>
