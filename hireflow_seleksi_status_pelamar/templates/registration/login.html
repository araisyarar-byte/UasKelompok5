{% load static %}
<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Admin | HireFlow</title><link rel="stylesheet" href="{% static 'seleksi_pelamar/css/admin.css' %}"></head>
<body class="login-page"><div class="login-card"><div class="brand centered"><span>H</span> HireFlow</div><h1>Masuk sebagai Admin</h1>
<p>Gunakan akun staf untuk mengakses seleksi pelamar.</p>
{% if form.errors %}<div class="error-box">Username atau password tidak sesuai.</div>{% endif %}
<form method="post">{% csrf_token %}<label>Username</label>{{ form.username }}<label>Password</label>{{ form.password }}
<button class="btn primary full">Masuk</button></form></div></body></html>
